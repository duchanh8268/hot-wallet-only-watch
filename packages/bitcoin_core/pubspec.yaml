name: bitcoin_core
description: Pure Dart Bitcoin Native SegWit (P2WPKH, BIP-84, Bech32, BIP-143, SEC-01 Guard) and BC-UR Air-Gap library.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  chain_core_interface:
    path: ../chain_core_interface
  crypto: ^3.0.6
  pointycastle: ^3.9.1
  typed_data: ^1.4.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
